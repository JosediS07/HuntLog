name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Tests unitarios
        run: ./mvnw test -B -DexcludedGroups=integration
        env:
          DB_URL: jdbc:postgresql://localhost:5432/huntlog
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: dW50cmFuc2FibGVzZWNyZXRrZXlmb3Jqd3QyNTZiaXRzbWluaW11bQ==
          JWT_EXPIRATION: 86400000
