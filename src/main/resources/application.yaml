spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/huntlog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

adzuna:
  base-url: https://api.adzuna.com/v1/api/jobs
  app-id: ${ADZUNA_APP_ID:}
  app-key: ${ADZUNA_APP_KEY:}
  timeout-seconds: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
